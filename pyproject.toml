[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rpp-plugin-registrator"
version = "0.1.0"
description = "RPP plugin registrator"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4,<7",
    "json5>=0.9,<1",
    "tree-sitter>=0.21,<0.27",
    "tree-sitter-cpp>=0.21,<0.24",
    "pycapnp>=1.3,<3",
    "rpp-common>=0.1,<0.2",
    "xmltodict>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rpp_plugin_registrator", "rpp_plugin_registrator.*"]
